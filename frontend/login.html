<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – HireHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: linear-gradient(135deg, #f0f7ff 0%, #e8f0fe 100%); min-height: 100vh; }
    .auth-page {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-box {
      background: white;
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      padding: 3rem 2.5rem;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 2rem;
    }
    .auth-logo .logo-icon {
      width: 40px; height: 40px;
      background: var(--primary);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.25rem;
    }
    .auth-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; }
    .auth-subtitle { color: var(--gray-500); margin-bottom: 2rem; }
    .divider { 
      display: flex; align-items: center; gap: 1rem; 
      color: var(--gray-400); font-size: 0.8rem; 
      margin: 1.5rem 0; 
    }
    .divider::before, .divider::after { 
      content: ''; flex: 1; height: 1px; background: var(--gray-200); 
    }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-box">
    <a href="index.html" class="auth-logo">
      <div class="logo-icon">💼</div>
      HireHub
    </a>

    <h1 class="auth-title">Welcome back!</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <div id="alertMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between;">
          Password
          <a href="#" style="font-weight:400;color:var(--primary);font-size:0.85rem;">Forgot password?</a>
        </label>
        <div style="position:relative;">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right:3rem;" />
          <button type="button" onclick="togglePassword()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1.1rem;color:var(--gray-400);" id="eyeBtn">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg" id="loginBtn">
        Sign In
      </button>
    </form>

    <div class="divider">or try demo accounts</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.5rem;">
      <button class="btn btn-secondary" onclick="fillDemo('jobseeker')">
        👤 Demo Seeker
      </button>
      <button class="btn btn-secondary" onclick="fillDemo('hr')">
        🏢 Demo HR
      </button>
    </div>

    <p class="text-center text-sm" style="color:var(--gray-500);">
      Don't have an account? 
      <a href="register.html" style="color:var(--primary);font-weight:600;">Create one free →</a>
    </p>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) {
    window.location.href = Auth.isHR() ? 'hr-dashboard.html' : 'dashboard.html';
  }

  function togglePassword() {
    const input = document.getElementById('password');
    const btn = document.getElementById('eyeBtn');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁';
    }
  }

  function fillDemo(role) {
    if (role === 'jobseeker') {
      document.getElementById('email').value = 'demo.seeker@hirehub.com';
      document.getElementById('password').value = 'demo1234';
    } else {
      document.getElementById('email').value = 'demo.hr@hirehub.com';
      document.getElementById('password').value = 'demo1234';
    }
  }

  function showAlert(msg, type = 'error') {
    document.getElementById('alertMsg').innerHTML = `
      <div class="alert alert-${type === 'error' ? 'error' : 'success'}">
        ${type === 'error' ? '❌' : '✅'} ${msg}
      </div>`;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = `<div class="spinner spinner-sm"></div> Signing in...`;
    document.getElementById('alertMsg').innerHTML = '';

    try {
      const data = await API.post('/auth/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      Auth.setSession(data.token, data.user);
      showAlert('Login successful! Redirecting...', 'success');

      setTimeout(() => {
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        if (redirect) {
          window.location.href = redirect;
        } else {
          window.location.href = data.user.role === 'hr' ? 'hr-dashboard.html' : 'dashboard.html';
        }
      }, 800);
    } catch (err) {
      showAlert(err.message);
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
